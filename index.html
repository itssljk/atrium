<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atrium Tabs</title>
    <!-- Pre-paint theme boot: CSP-safe external file (MV3 blocks inline
         scripts). Generated at build time from src/themeBoot.ts — edit that
         file, never this reference. -->
    <script src="./themeBoot.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-128.png" />
    <!-- Local Font Preload (Instantaneous Frame-1 Offline Typography) -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="min-h-full flex flex-col">
    <div id="root" class="min-h-full flex flex-col flex-1">
      <!-- Instant Frame-1 Skeleton (Paints in < 8ms, cleanly replaced when React mounts) -->
      <div id="boot-skeleton" style="min-height: 100vh; min-height: 100dvh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; pointer-events: none; user-select: none;">
        <div style="width: 100%; max-width: 56rem; display: flex; flex-direction: column; align-items: center; gap: 40px; padding-top: 18vh;">
          <div style="height: 36px; width: 240px; max-width: 80%; border-radius: 9999px; background: rgba(248, 249, 252, 0.03);"></div>
          <div style="width: 100%; max-width: 42rem; height: 52px; border-radius: 9999px; background: rgba(10, 11, 22, 0.45); border: 1px solid rgba(255, 255, 255, 0.06); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 16px; height: 16px; border-radius: 9999px; background: rgba(248, 249, 252, 0.12);"></div>
              <div style="width: 130px; height: 12px; border-radius: 4px; background: rgba(248, 249, 252, 0.06);"></div>
            </div>
            <div style="width: 24px; height: 16px; border-radius: 6px; background: rgba(248, 249, 252, 0.06);"></div>
          </div>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 36rem;">
            <div style="width: 88px; height: 36px; border-radius: 9999px; background: rgba(248, 249, 252, 0.03); border: 1px solid rgba(255, 255, 255, 0.04);"></div>
            <div style="width: 104px; height: 36px; border-radius: 9999px; background: rgba(248, 249, 252, 0.03); border: 1px solid rgba(255, 255, 255, 0.04);"></div>
            <div style="width: 80px; height: 36px; border-radius: 9999px; background: rgba(248, 249, 252, 0.03); border: 1px solid rgba(255, 255, 255, 0.04);"></div>
            <div style="width: 96px; height: 36px; border-radius: 9999px; background: rgba(248, 249, 252, 0.03); border: 1px solid rgba(255, 255, 255, 0.04);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
